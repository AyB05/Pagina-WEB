<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="container mt-5">
        <h1 class="text-center">Ingrese su nombre</h1>
        <input type="text" id="nombre" class="form-control mb-3" placeholder="Escriba su nombre">
        <button onclick="bienvenida()" class="btn btn-primary w-100">Enviar</button>
        <p id="mensaje" class="alert alert-info mt-3"></p>
    </div>
    
    <script>
        function bienvenida() {
            let nombre = document.getElementById("nombre").value;
            document.getElementById("mensaje").innerHTML = "Bienvenido " + nombre + ", al sistema de consulta.";
        }
    </script>

</body>
</html>
