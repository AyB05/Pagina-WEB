<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Seleccione un número del 1 al 10</h1>
        <select id="numero" class="form-select mb-3">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <button onclick="mostrarTabla()" class="btn btn-primary w-100">Mostrar Tabla</button>
        <div id="tablaResultado" class="mt-3 alert alert-info"></div>
    </div>
    
    <script>
        function mostrarTabla() {
            let numero = document.getElementById("numero").value;
            let resultado = "";
            for (let i = 1; i <= 12; i++) {
                resultado += `${i} x ${numero} = ${i * numero}<br>`;
            }
            document.getElementById("tablaResultado").innerHTML = resultado;
        }
    </script>
</body>
</html>
