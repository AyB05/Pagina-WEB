<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="container mt-5">
        <h1 class="text-center">Ingrese su edad</h1>
        <input type="number" id="edad" class="form-control mb-3" placeholder="Escriba su edad">
        <button onclick="verificarEdad()" class="btn btn-primary w-100">Enviar</button>
        <p id="mensaje" class="alert alert-info mt-3"></p>
    </div>
    
    <script>
        function verificarEdad() {
            let edad = document.getElementById("edad").value;
            if (edad >= 18) {
                document.getElementById("mensaje").innerHTML = "Usted tiene acceso a todos nuestros servicios.";
            } else {
                document.getElementById("mensaje").innerHTML = "Usted tiene acceso a servicios limitados.";
            }
        }
    </script>

</body>
</html>
