<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Ingrese un número del 1 al 10</h1>
        <input type="number" id="numero" class="form-control mb-3" min="1" max="10" placeholder="Escriba un número">
        <button onclick="mostrarTabla()" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#tablaModal">Mostrar Tabla</button>
    </div>
    
    <!-- Modal -->
    <div class="modal fade" id="tablaModal" tabindex="-1" aria-labelledby="tablaModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="tablaModalLabel">Tabla de Multiplicar</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="tablaResultado">
            <!-- La tabla de multiplicar aparece aqui-->
          </div>
        </div>
      </div>
    </div>
    
    <script>
        function mostrarTabla() {
            let numero = document.getElementById("numero").value;
            let resultado = "";
            for (let i = 1; i <= 12; i++) {
                resultado += `${i} x ${numero} = ${i * numero}<br>`;
            }
            document.getElementById("tablaResultado").innerHTML = resultado;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
